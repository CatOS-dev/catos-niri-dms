schema = 4
name = "CatOS Niri DMS"
description = "Complete CatOS Niri desktop powered by Dank Material Shell"

packages = [
  "niri",
  "xdg-desktop-portal-gtk",
  "xdg-desktop-portal-gnome",
  "dms-shell-niri",
  "matugen",
  "cava",
  "cliphist",
  "cups-pk-helper",
  "i2c-tools",
  "power-profiles-daemon",
  "qt6-multimedia",
  "wtype",
  "ghostty",
  "xwayland-satellite",
  "catos-graphite-gtk-theme",
  "catos-tela-icon-theme-blue",
  "catos-bibata-cursor",
]

manage = [
  ".config/niri/config.kdl",
  ".config/niri/dms/binds.kdl",
  ".config/environment.d/80-catos-niri.conf",
  ".gtkrc-2.0",
  ".config/gtk-3.0/settings.ini",
  ".config/gtk-4.0/settings.ini",
  ".config/gtk-4.0/gtk.css",
  ".icons/default/index.theme",
]
