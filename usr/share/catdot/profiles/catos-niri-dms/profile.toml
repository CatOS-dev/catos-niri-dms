schema = 4
name = "CatOS Niri DMS"
description = "Complete CatOS Niri desktop powered by Dank Material Shell"

packages = [
  "niri",
  "xdg-desktop-portal-gtk",
  "xdg-desktop-portal-gnome",
  "gnome-keyring",
  "dms-shell",
  "catos-niri-utils",
  "matugen",
  "adw-gtk-theme",
  "qt6ct-kde",
  "qt6-multimedia",
  "fuzzel",
  "satty",
  "wl-clipboard",
  "fcitx5",
  "btop",
  "cava",
  "cliphist",
  "cups-pk-helper",
  "i2c-tools",
  "power-profiles-daemon",
  "wtype",
  "ghostty",
  "xwayland-satellite",
  "tela-circle-icon-theme-all",
  "catos-bibata-cursor",
]

